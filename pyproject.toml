[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mechvane"
version = "0.1.0a8"
description = "Parametric 3D CAD for everyday mechanical engineering: you and your AI agent on the same model, built on SolidCraft"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = ["mcp>=1.20,<2"]
keywords = ["cad", "parametric", "mechanical-engineering", "mcp", "solidcraft", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/mechvane/mechvane"
Demo = "https://mechvane.dev/"
Roadmap = "https://github.com/mechvane/mechvane/blob/main/ROADMAP.md"
Issues = "https://github.com/mechvane/mechvane/issues"
Changelog = "https://github.com/mechvane/mechvane/blob/main/CHANGELOG.md"

[project.scripts]
mechvane = "mechvane.cli:main"

[tool.setuptools.packages.find]
include = ["mechvane*"]

[tool.setuptools.package-data]
mechvane = ["data/*.json"]
"mechvane.ui" = ["static/**/*"]
