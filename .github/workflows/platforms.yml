# Nightly and push verification across platforms (Windows, macOS, Linux).
name: Platforms

"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# The jobs only read the repository and upload artifacts: no write access needed.
permissions:
  contents: read

jobs:
  platforms:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    if: github.repository == 'mechvane/mechvane'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache SolidCraft downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mechvane
            ~/AppData/Local/mechvane
          key: solidcraft-${{ runner.os }}-${{ hashFiles('mechvane/install.py') }}
          restore-keys: |
            solidcraft-${{ runner.os }}-

      - name: Install Mechvane
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run CI smoke test
        run: python tools/ci_smoke.py
